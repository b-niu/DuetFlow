# DuetFlow 配置示例 (请复制一份重命名为 config.yaml 使用)
# config.yaml 会被 git 自动忽略，切勿提交真实敏感信息

ssh:
  # 支持两种方式：
  # 方式 1: 直接使用 ~/.ssh/config 中配置的 Host 别名 (如 "macbook")
  # 方式 2: 配置真实 IP 地址 (如 "192.168.1.101")
  host: "192.168.1.101"
  port: 22
  user: "your_mac_username"
  # 私钥路径：默认自动使用 ~/.ssh/id_rsa
  # key_path: "~/.ssh/id_rsa"

sync_paths:
  windows_root: "D:/Workspaces/Projects"
  mac_root: "/Users/your_mac_username/Workspaces/Projects"

exclude:
  - "**/.git"
  - "**/.git/**"
  - "**/.cursor"
  - "**/.claude"
  - "**/node_modules"
  - "**/__pycache__"
  - "**/.venv"
  - "**/.env"
  - "**/.DS_Store"
  - "**/._*"
  - "**/Thumbs.db"

text_extensions:
  - ".py"
  - ".md"
  - ".txt"
  - ".json"
  - ".yaml"
  - ".yml"
  - ".csv"
  - ".sh"
  - ".toml"
  - ".ini"

safety:
  quarantine_days: 30
  circuit_breaker:
    max_ratio: 0.20
    max_count: 50

baseline:
  authority: "desktop"
  file_name: "baseline.json.gz"
