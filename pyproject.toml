[project]
name = "duetflow"
version = "0.1.0"
description = "Two-device file synchronization engine for Windows and macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.4.0",
    "xxhash>=3.4.1",
    "pyjson5>=1.6.0",
    "pillow>=10.0.0",
    "rich>=13.7.0",
    "pyside6>=6.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

